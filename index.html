<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Word Puzzle Master - Premium Edition</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Phaser.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <!-- Firebase SDK (Optional - for future leaderboard) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- ============================================
         GAME SCREEN - 즉시 시작 (NO LOGIN)
         ============================================ -->
    <div id="game-screen" class="screen-container active">
        <!-- Header UI (간소화) -->
        <div id="header">
            <div class="game-title-container">
                <h2 class="game-title">🎮 Word Puzzle Master</h2>
            </div>
        </div>
        
        <!-- Main Game Area (Grid + Panels) -->
        <div class="game-main-area">
            <!-- Left Panel - Leaderboard -->
            <div id="leaderboard-panel" class="side-panel left-panel">
                <h3>🏆 리더보드</h3>
                <div class="panel-subtitle">Top Players</div>
                <div id="leaderboard-list">
                    <!-- 더미 데이터 -->
                    <div class="leaderboard-item rank-1">
                        <span class="rank">1</span>
                        <span class="player-name">SuperGamer</span>
                        <span class="score">15,420</span>
                    </div>
                    <div class="leaderboard-item rank-2">
                        <span class="rank">2</span>
                        <span class="player-name">WordMaster</span>
                        <span class="score">14,850</span>
                    </div>
                    <div class="leaderboard-item rank-3">
                        <span class="rank">3</span>
                        <span class="player-name">PuzzlePro</span>
                        <span class="score">13,990</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">4</span>
                        <span class="player-name">BrainTeaser</span>
                        <span class="score">12,760</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">5</span>
                        <span class="player-name">QuickThinker</span>
                        <span class="score">11,540</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">6</span>
                        <span class="player-name">LetterHunter</span>
                        <span class="score">10,220</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">7</span>
                        <span class="player-name">WordNinja</span>
                        <span class="score">9,870</span>
                    </div>
                    <div class="leaderboard-item">
                        <span class="rank">8</span>
                        <span class="player-name">GridExplorer</span>
                        <span class="score">8,450</span>
                    </div>
                </div>
            </div>
            
            <!-- Center - Game Container -->
            <div id="game-container"></div>
            
            <!-- Right Panel - Word List -->
            <div id="word-list-panel" class="side-panel right-panel">
                <h3>찾아야 할 단어</h3>
                <div class="panel-subtitle">총 10개</div>
                <div id="words-to-find">
                    <div class="loading">Loading words...</div>
                </div>
            </div>
        </div>
        
        <!-- Drag Feedback Display -->
        <div id="drag-feedback">
            <div class="drag-label">현재 선택:</div>
            <div id="drag-text" class="drag-word">-</div>
        </div>
        
        <!-- Footer - Game Status Bar -->
        <div id="footer">
            <div class="status-bar">
                <div class="status-group">
                    <div class="status-icon">💯</div>
                    <div class="status-info">
                        <div class="status-label">현재 점수</div>
                        <div class="status-value" id="footer-score">0</div>
                    </div>
                </div>
                
                <div class="status-divider"></div>
                
                <div class="status-group">
                    <div class="status-icon">🔥</div>
                    <div class="status-info">
                        <div class="status-label">배수</div>
                        <div class="status-value" id="footer-multiplier">1.00x</div>
                        <!-- Multiplier 게이지 -->
                        <div class="multiplier-gauge">
                            <div class="multiplier-gauge-fill" id="multiplier-gauge-fill"></div>
                        </div>
                    </div>
                </div>
                
                <div class="status-divider"></div>
                
                <div class="status-group">
                    <div class="status-icon">🏆</div>
                    <div class="status-info">
                        <div class="status-label">최고 기록</div>
                        <div class="status-value" id="footer-high-score">0</div>
                    </div>
                </div>
                
                <div class="status-divider"></div>
                
                <div class="status-group">
                    <div class="status-icon">📊</div>
                    <div class="status-info">
                        <div class="status-label">찾은 단어</div>
                        <div class="status-value" id="footer-found">0/10</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <!-- Cordova.js는 Cordova 빌드 시 자동 주입되므로 여기서는 제거 -->
    <!-- 브라우저 환경에서는 cordova-init.js가 자동으로 감지하고 스킵 -->
    <script src="js/cordova-init.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/WordGenerator.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
